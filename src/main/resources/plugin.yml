name: MTV
version: '${project.version}'
main: com.yiittv.mtv.MtvPlugin
api-version: '1.21.11'
depend: [MapEngine]
softdepend: [PlasmoVoice]
authors: [YiitTV, unknown_56]
description: MTV - billboard and media map screens with Plasmo Voice audio. Unofficial modified build based on LuigiScreen.

commands:
  mtv:
    description: Manage MTV media screens and Control Studio.
    aliases: [tv]
    usage: /mtv <menu|web|create|clone|list|start|stop|remove|status|source|playlist|event|vote|set|reload|debug|mediamtx>

permissions:
  mtv.admin:
    description: Grants every MTV command and access to protected screens.
    default: op
    children:
      mtv.create: true
      mtv.clone: true
      mtv.list: true
      mtv.start: true
      mtv.stop: true
      mtv.remove: true
      mtv.status: true
      mtv.source: true
      mtv.playlist: true
      mtv.event: true
      mtv.set: true
      mtv.reload: true
      mtv.debug: true
      mtv.mediamtx: true
      mtv.update: true
      mtv.vote: true
      mtv.web: true
      mtv.menu.*: true
      mtv.see.*: true
  mtv.create:
    description: Allows creating screens.
    default: false
  mtv.clone:
    description: Allows cloning screens.
    default: false
  mtv.list:
    description: Allows listing configured screens.
    default: false
  mtv.start:
    description: Allows enabling screens.
    default: false
  mtv.stop:
    description: Allows disabling screens.
    default: false
  mtv.remove:
    description: Allows removing screens.
    default: false
  mtv.status:
    description: Allows viewing screen and stream status.
    default: false
  mtv.source:
    description: Allows viewing and changing screen media sources.
    default: false
  mtv.playlist:
    description: Allows assigning and clearing screen playlists.
    default: false
  mtv.event:
    description: Allows playing and stopping screen events.
    default: false
  mtv.set:
    description: Allows changing per-screen settings.
    default: false
  mtv.reload:
    description: Allows reloading MTV.
    default: false
  mtv.debug:
    description: Allows viewing MTV debug statistics.
    default: false
  mtv.mediamtx:
    description: Allows generating MediaMTX configurations and credentials.
    default: false
  mtv.update:
    description: Receives notifications when a newer MTV version is available.
    default: op
  mtv.menu.*:
    description: Grants access to every MTV Control Studio section.
    default: false
    children:
      mtv.menu.dashboard: true
      mtv.menu.screens: true
      mtv.menu.media: true
      mtv.menu.playlists: true
      mtv.menu.events: true
      mtv.menu.automations: true
      mtv.menu.live: true
      mtv.menu.groups: true
      mtv.menu.schedules: true
      mtv.menu.templates: true
      mtv.menu.diagnostics: true
      mtv.menu.monitoring: true
      mtv.menu.configuration: true
      mtv.menu.settings: true
      mtv.menu.history: true
      mtv.menu.emergency: true
      mtv.menu.control: true
  mtv.menu.dashboard:
    description: Opens MTV Control Studio.
    default: op
  mtv.menu.screens:
    description: Views screens and their details in Control Studio.
    default: false
  mtv.menu.media:
    description: Views and cues Media Library sources.
    default: false
  mtv.menu.playlists:
    description: Views, simulates and assigns playlists.
    default: false
  mtv.menu.events:
    description: Views and starts event timelines.
    default: false
  mtv.menu.automations:
    description: Views Web Studio automation rules.
    default: false
  mtv.menu.live:
    description: Uses Live Control Room.
    default: false
  mtv.menu.groups:
    description: Controls screen groups.
    default: false
  mtv.menu.schedules:
    description: Views the schedule calendar.
    default: false
  mtv.menu.templates:
    description: Installs starter templates.
    default: false
  mtv.menu.diagnostics:
    description: Views screen diagnostics.
    default: false
  mtv.menu.monitoring:
    description: Views Web Studio performance monitoring.
    default: false
  mtv.menu.configuration:
    description: Stages and publishes safe Web Studio configuration changes.
    default: false
  mtv.menu.settings:
    description: Views Web Studio server and session settings.
    default: false
  mtv.menu.history:
    description: Views the studio audit history.
    default: false
  mtv.menu.emergency:
    description: Enables or disables global emergency mode.
    default: false
  mtv.menu.control:
    description: Changes playback and screen state from menus.
    default: false
  mtv.vote:
    description: Allows a player to vote in active MTV media votes.
    default: true
  mtv.web:
    description: Creates and revokes secure MTV Studio web sessions.
    default: op
  mtv.see.*:
    description: Allows viewing every permission-protected screen.
    default: false
