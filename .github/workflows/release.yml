name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check tag matches project version
        shell: bash
        run: |
          version=$(mvn -q -B --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom version ${version}" >&2
            exit 1
          fi

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MTV ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            MTV billboard plugin for Paper 1.21.11 (Java 21).

            - Requires MapEngine 1.8.12.
            - Optional: PlasmoVoice for per-screen positional audio, yt-dlp for YouTube sources.
            - Put `MTV-*.jar` into `plugins/`. Supports Windows x86_64 and Linux x86_64 servers.

            Unofficial modified build based on LuigiScreen Free (AGPL-3.0-only).
          files: target/MTV-*.jar
          fail_on_unmatched_files: true
